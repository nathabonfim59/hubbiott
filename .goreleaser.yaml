# This is an example .goreleaser.yml file with some sensible defaults.
# Make sure to check the documentation at https://goreleaser.com

# The lines below are called `modelines`. See `:help modeline`
# Feel free to remove those if you don't want/need to use them.
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

before:
  hooks:
    # You may remove this if you don't use go modules.
    - go mod tidy
    # you may remove this if you don't need go generate
    - go generate ./...

builds:
  # Standard Linux build (glibc)
  - id: linux
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64

  # Linux with musl (static linking)
  - id: linux-musl
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -extldflags '-static'
    flags:
      - -tags=musl

  # Windows build
  - id: windows
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
      - arm64

  # macOS build
  - id: darwin
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: standard
    formats: [tar.gz]
    builds:
      - linux
      - windows
      - darwin
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]

  - id: musl
    formats: [tar.gz]
    builds:
      - linux-musl
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}_musl

nfpms:
  - id: packages
    package_name: "{{ .ProjectName }}"
    file_name_template: "{{ .PackageName }}_{{ .Version }}_{{ .Arch }}"
    vendor: Nathanael Bonfim
    homepage: https://github.com/nathabonfim59/hubbiott
    maintainer: Nathanael Bonfim <dev@nathabonfim59.com>
    description: |
      Hubbiott - GitHub Bot Management Platform
      A Discord bot that generates PR summaries using OpenCode AI,
      streams media files, and provides a web dashboard for configuration.
    license: MIT
    formats:
      - deb
      - rpm
    builds:
      - linux
    bindir: /usr/local/bin
    contents:
      # Systemd service unit file
      - src: ./config/hubbiott.service
        dst: /etc/systemd/system/hubbiott.service
        file_info:
          mode: 0644
          owner: root
          group: root
      # Example configuration
      - src: ./config/config.example.yaml
        dst: /etc/hubbiott/config.example.yaml
        file_info:
          mode: 0644
          owner: root
          group: root
        type: config|noreplace
    scripts:
      preinstall: ./scripts/preinstall.sh
      postinstall: ./scripts/postinstall.sh
      preremove: ./scripts/preremove.sh
      postremove: ./scripts/postremove.sh

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  footer: >-

    ---

    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).
